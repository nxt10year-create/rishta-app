<style>
  :root{
    --bg: #0A0E17;
    --surface: rgba(255,255,255,0.045);
    --surface-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --text: #EEF1F8;
    --text-soft: #9AA3B8;
    --text-faint: #5B6478;
    --primary-a: #7C6CF6;
    --primary-b: #EC4899;
    --relation: #A5B4FC; --relation-txt:#C7D2FE; --relation-bg: rgba(129,140,248,0.16); --relation-bd: rgba(129,140,248,0.4);
    --work: #5EEAD4; --work-txt:#99F6E4; --work-bg: rgba(45,212,191,0.15); --work-bd: rgba(45,212,191,0.4);
    --connection: #7DD3FC; --connection-txt:#BAE6FD; --connection-bg: rgba(56,189,248,0.15); --connection-bd: rgba(56,189,248,0.4);
    --special: #FCD34D; --special-txt:#FDE68A; --special-bg: rgba(251,191,36,0.18); --special-bd: rgba(251,191,36,0.45);
    --danger: #FB7185;
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(700px 500px at 8% -5%, rgba(124,108,246,0.22), transparent 60%),
      radial-gradient(600px 500px at 95% 10%, rgba(236,72,153,0.14), transparent 55%),
      radial-gradient(800px 600px at 50% 110%, rgba(56,189,248,0.10), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    line-height:1.5;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }

  .container{ max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ===== Header ===== */
  .topbar{ padding: 36px 0 20px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; color:#fff;
    box-shadow: 0 8px 20px rgba(124,108,246,0.35);
  }
  .brand h1{ font-size:22px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:2px 0 0; font-size:13px; color:var(--text-faint); }
  .stat-pills{ display:flex; gap:10px; }
  .stat-pill{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding:10px 16px; text-align:center; backdrop-filter: blur(16px);
  }
  .stat-pill .num{ font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--primary-a),var(--primary-b)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ===== Toolbar ===== */
  .toolbar{ display:flex; gap:12px; padding: 4px 0 6px; flex-wrap:wrap; }

  #searchInput{
    width:100%; padding:13px 16px 13px 40px;
    border:1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); backdrop-filter: blur(16px);

    transition: border-color .15s, background .15s;
  }
  #searchInput::placeholder{ color: var(--text-faint); }
  #searchInput:focus{ border-color: var(--primary-a); background: var(--surface-2); }
  #addBtn{
    display:flex; align-items:center; gap:8px;

    font: inherit; font-size:14.5px; font-weight:700; cursor:pointer;

  }
  #addBtn:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px rgba(124,108,246,0.4); }
  #addBtn:active{ transform: translateY(0); }
  #addBtn svg{ width:15px; height:15px; }
  #filterToggleBtn{
    display:flex; align-items:center; gap:8px;
    background: var(--surface); border:1px solid var(--border); color: var(--text-soft);
    padding: 13px 18px; border-radius: var(--radius-sm); font: inherit; font-size:14px; font-weight:600;
    cursor:pointer; backdrop-filter: blur(16px); transition: background .12s, color .12s, border-color .12s;
  }
  #filterToggleBtn:hover{ background: var(--surface-2); color: var(--text); }
  #filterToggleBtn.active{ border-color: var(--primary-a); color: var(--text); }
  #filterToggleBtn svg{ width:15px; height:15px; }
  #filterToggleBtn .chev{ transition: transform .15s; }
  #filterToggleBtn.open .chev{ transform: rotate(180deg); }
  #filterToggleBtn .badge{
    background: linear-gradient(135deg,var(--primary-a),var(--primary-b)); color:#fff; font-size:11px; font-weight:700;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  }
  .icon-toolbar-btn{
    display:flex; align-items:center; justify-content:center;
    background: var(--surface); border:1px solid var(--border); color: var(--text-soft);
    width:44px; height:44px; border-radius: var(--radius-sm); cursor:pointer;
    backdrop-filter: blur(16px); transition: background .12s, color .12s;
    flex-shrink:0;
  }
  .icon-toolbar-btn:hover{ background: var(--surface-2); color: var(--text); }
  .icon-toolbar-btn svg{ width:17px; height:17px; }

  .filter-note{ padding: 12px 2px 0; font-size:13px; color: var(--text-soft); display:none; align-items:center; gap:6px; flex-wrap:wrap; }
  .filter-note.show{ display:flex; }
  .filter-note button{ background:none; border:none; color:var(--primary-a); font:inherit; font-weight:700; cursor:pointer; padding:0; }

  /* ===== Layout ===== */
  .layout{ display:flex; gap: 22px; padding: 20px 0 70px; align-items:flex-start; }
  .tab-rail{
    width: 250px; flex-shrink:0; position: sticky; top: 20px;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 16px; backdrop-filter: blur(16px);
    display:flex; flex-direction:column; gap:16px;
    max-height: calc(100vh - 40px); overflow-y:auto;
    animation: railIn .18s ease both;
  }
  .tab-rail.hidden{ display:none; }
  @keyframes railIn{ from{ opacity:0; transform:translateX(-8px);} to{opacity:1; transform:none;} }
  .tab-group-title{ font-size:11px; text-transform:none; color: var(--text-faint); margin:0 0 8px 4px; font-weight:700; }
  .tab-btn{
    display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%;
    text-align:left; background: transparent; border:1px solid transparent; border-radius: 10px;
    padding: 8px 10px; margin-bottom:3px; font: inherit; font-size:13px; color: var(--text-soft);
    cursor:pointer; transition: background .12s, color .12s;
  }
  .tab-btn:hover{ background: var(--surface-2); color:var(--text); }
  .tab-btn .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-right:8px; display:inline-block; }
  .tab-btn .label-wrap{ display:flex; align-items:center; flex:1; min-width:0; }
  .tab-btn .label-wrap span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab-btn .cnt{ font-size:11.5px; color: var(--text-faint); }
  .tab-btn.active{ font-weight:700; color:var(--text); }
  .tab-btn.active.g-relation{ background: var(--relation-bg); border-color: var(--relation-bd); }
  .tab-btn.active.g-work{ background: var(--work-bg); border-color: var(--work-bd); }
  .tab-btn.active.g-connection{ background: var(--connection-bg); border-color: var(--connection-bd); }
  .tab-btn.active.g-special{ background: var(--special-bg); border-color: var(--special-bd); }
  .tab-btn.active.g-other{ background: var(--surface-2); border-color: var(--border); }

  /* ===== Entries ===== */
  .register{ flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .entry-card{
    display:flex; gap:14px; padding: 16px; background: var(--surface); border:1px solid var(--border-soft);
    border-radius: var(--radius); backdrop-filter: blur(14px);
    animation: fadeIn .3s ease both; transition: border-color .15s, background .15s;
  }
  .entry-card:hover{ border-color: var(--border); background: var(--surface-2); }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .avatar{
    width:44px; height:44px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#0A0E17;
    background: var(--avatar-color, linear-gradient(135deg,#94A3B8,#CBD5E1));
  }
  .entry-main{ flex:1; min-width:0; }
  .entry-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .entry-name-wrap{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .entry-name{ font-size:16px; font-weight:700; color: var(--text); }
  .star-badge{ width:15px; height:15px; fill: var(--special); flex-shrink:0; }
  .phone-row{ display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap; }
  .phone-num{ font-size:13.5px; color: var(--text-soft); }
  .phone-actions{ display:flex; gap:6px; }
  .phone-actions a{
    display:flex; align-items:center; gap:5px; text-decoration:none;
    font-size:11.5px; font-weight:600; padding: 4px 9px; border-radius: 999px;
    border:1px solid var(--border); color: var(--text-soft); transition: all .12s;
  }
  .phone-actions a.call:hover{ background: var(--connection-bg); border-color: var(--connection-bd); color: var(--connection-txt); }
  .phone-actions a.wa:hover{ background: rgba(37,211,102,0.16); border-color: rgba(37,211,102,0.4); color:#6EE7A8; }
  .phone-actions svg{ width:12.5px; height:12.5px; }
  .entry-actions{ display:flex; gap:4px; }
  .icon-btn{ background:none; border:none; cursor:pointer; padding:6px; color: var(--text-faint); border-radius: 9px; display:flex; }
  .icon-btn:hover{ color: var(--text); background: var(--surface-2); }
  .icon-btn svg{ width:16px; height:16px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{ font-size:11.5px; font-weight:600; padding: 4px 10px; border-radius: 999px; border:1px solid transparent; white-space:nowrap; }
  .chip-relation{ background:var(--relation-bg); color:var(--relation-txt); border-color:var(--relation-bd); }
  .chip-work{ background:var(--work-bg); color:var(--work-txt); border-color:var(--work-bd); }
  .chip-connection{ background:var(--connection-bg); color:var(--connection-txt); border-color:var(--connection-bd); }
  .chip-special{ background:var(--special-bg); color:var(--special-txt); border-color:var(--special-bd); }
  .chip-neutral{ background:transparent; color:var(--text-faint); border-color:var(--border); border-style:dashed; }
  .entry-notes{ margin-top:8px; font-size:12.5px; color: var(--text-faint); font-style:italic; }

  .empty-state{ text-align:center; padding: 80px 20px; color: var(--text-soft); background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); }
  .empty-state .big{ font-size:18px; font-weight:700; color: var(--text); margin-bottom:6px; }

  /* ===== Modal ===== */
  .modal-overlay{ position:fixed; inset:0; background: rgba(4,6,12,0.65); backdrop-filter: blur(4px); display:none; align-items:flex-start; justify-content:center; padding: 40px 16px; overflow-y:auto; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .index-card{
    background: #0F1524; border:1px solid var(--border); width: 100%; max-width: 580px;
    border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); padding: 28px 28px 22px;
    animation: cardIn .2s ease both;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(12px) scale(.98);} to{opacity:1; transform:none;} }
  .index-card h2{ margin: 0 0 18px; font-size:19px; font-weight:800; }
  .field-row{ display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .field{ flex:1; min-width:150px; }
  .field label{ display:block; font-size:12px; color:var(--text-faint); margin-bottom:6px; font-weight:600; }
  .field input[type=text], .field input[type=tel], .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.03); color: var(--text); font: inherit; font-size:14px; outline:none;
    transition:border-color .12s;
  }
  .field input::placeholder, .field textarea::placeholder{ color: var(--text-faint); }
  .field input:focus, .field textarea:focus{ border-color: var(--primary-a); }
  .field textarea{ resize:vertical; min-height:56px; }

  .section-label{ font-size:12px; color:var(--text-faint); font-weight:700; margin: 18px 0 9px; }
  .pill-group{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill{
    padding: 7px 14px; border-radius:999px; border:1px solid var(--border); background: rgba(255,255,255,0.03);
    font: inherit; font-size:12.5px; font-weight:600; cursor:pointer; color: var(--text-soft); transition: all .12s;
  }
  .pill.on-relation{ background:var(--relation-bg); border-color:var(--relation-bd); color:var(--relation-txt); }
  .pill.on-work{ background:var(--work-bg); border-color:var(--work-bd); color:var(--work-txt); }
  .pill.on-connection{ background:var(--connection-bg); border-color:var(--connection-bd); color:var(--connection-txt); }
  .pill.on-special{ background:var(--special-bg); border-color:var(--special-bd); color:var(--special-txt); }
  .pill-add{ border-style:dashed; color:var(--text-faint); background:transparent; }
  .pill-add:hover{ color:var(--text); border-color:var(--text-faint); }

  .inline-add-row{ display:none; gap:8px; margin-top:8px; }
  .inline-add-row.show{ display:flex; }
  .inline-add-row input{
    flex:1; padding:8px 11px; border:1px solid var(--border); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.03); color:var(--text); font: inherit; font-size:13px; outline:none;
  }
  .inline-add-row input:focus{ border-color: var(--primary-a); }
  .inline-add-row button{
    border:1px solid var(--border); background: rgba(255,255,255,0.05); color:var(--text);
    border-radius: var(--radius-sm); padding: 0 14px; cursor:pointer; font-weight:600; font-size:13px;
  }

  .chip-input-row{ display:flex; gap:8px; margin-top:4px; }
  .chip-input-row input{ flex:1; padding:9px 11px; border:1px solid var(--border); border-radius: var(--radius-sm); background: rgba(255,255,255,0.03); color:var(--text); font: inherit; font-size:13.5px; outline:none; }
  .chip-input-row input:focus{ border-color: var(--primary-a); }
  .chip-add-btn{ border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text); border-radius: var(--radius-sm); padding: 0 14px; cursor:pointer; font-weight:600; }
  .quick-suggest{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .quick-suggest button{ font-size:11.5px; padding:4px 10px; border-radius:999px; border:1px dashed var(--border); background:none; color:var(--text-faint); cursor:pointer; }
  .quick-suggest button:hover{ border-color:var(--text-faint); color:var(--text); }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .chip-removable{ display:flex; align-items:center; gap:6px; background: rgba(255,255,255,0.06); color: var(--text); font-size:12px; padding: 4px 6px 4px 11px; border-radius:999px; }
  .chip-removable button{ background:none; border:none; cursor:pointer; color:var(--text-faint); font-size:14px; line-height:1; padding:2px; }

  .modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top: 22px; padding-top:16px; border-top:1px solid var(--border-soft); }
  .btn{ font: inherit; font-size:14px; font-weight:700; padding:10px 18px; border-radius: var(--radius-sm); cursor:pointer; border:1px solid transparent; }
  .btn-primary{ background: linear-gradient(135deg, var(--primary-a), var(--primary-b)); color:#fff; }
  .btn-ghost{ background:none; color:var(--text-soft); border-color:var(--border); }
  .btn-danger{ background:none; color:var(--danger); border-color:rgba(251,113,133,0.35); }
  .footer-right{ display:flex; gap:10px; }

  ::selection{ background: rgba(124,108,246,0.4); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius:8px; }

  .toast{
    position: fixed; left:50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #171E30; border:1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 12px; font-size:13px; font-weight:600;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45); opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s; z-index:100;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    .tab-rail{ width:100%; position:static; max-height:none; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">रि</div>
      <div>
        <h1>रिश्ता</h1>
        <p>हर संपर्क की अपनी अलग पहचान</p>
      </div>
    </div>
    <div class="stat-pills">
      <div class="stat-pill"><div class="num" id="totalCount">0</div><div class="lbl">कुल संपर्क</div></div>
      <div class="stat-pill amber"><div class="num" id="eventCount">0</div><div class="lbl">फंक्शन के लिए बेस्ट</div></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="नाम या नंबर से खोजें...">
    </div>
    <button id="filterToggleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      फ़िल्टर
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px;"><polyline points="6 9 12 15 18 9"/></svg>
      <span class="badge" id="filterBadge" style="display:none;">0</span>
    </button>
    <button id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      नई एंट्री
    </button>
    <button id="exportBtn" class="icon-toolbar-btn" title="बैकअप डाउनलोड करें">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button id="importBtn" class="icon-toolbar-btn" title="बैकअप वापस लाएँ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="filter-note" id="filterNote">
    <span id="filterNoteText"></span> <button id="clearFiltersBtn">सारे फ़िल्टर हटाएँ</button>
  </div>

  <div class="layout">
    <aside class="tab-rail hidden" id="tabRail"></aside>
    <main class="register" id="registerList"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="index-card">
    <h2 id="modalTitle">नई एंट्री जोड़ें</h2>

    <div class="field-row">
      <div class="field">
        <label>नाम *</label>
        <input type="text" id="fName" placeholder="जैसे — रमेश चाचा">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>मुख्य नंबर *</label>
        <input type="tel" id="fPhone" placeholder="10 अंकों का नंबर">
      </div>
      <div class="field">
        <label>वैकल्पिक नंबर</label>
        <input type="tel" id="fAltPhone" placeholder="(वैकल्पिक)">
      </div>
    </div>

    <div class="section-label">रिश्ता</div>
    <div class="pill-group" id="groupRelation"></div>
    <div class="inline-add-row" id="addRow-relation">
      <input type="text" id="addInput-relation" placeholder="नया विकल्प लिखें...">
      <button data-confirm="relation">जोड़ें</button>
    </div>

    <div class="section-label">काम की समझ</div>
    <div class="pill-group" id="groupWork"></div>
    <div class="inline-add-row" id="addRow-work">
      <input type="text" id="addInput-work" placeholder="नया विकल्प लिखें...">
      <button data-confirm="work">जोड़ें</button>
    </div>

    <div class="section-label">हुनर / काम (जैसे — प्लंबिंग, इलेक्ट्रिकल)</div>
    <div class="chip-input-row">
      <input type="text" id="skillInput" placeholder="हुनर लिखें और Enter दबाएँ">
      <button class="chip-add-btn" id="skillAddBtn">जोड़ें</button>
    </div>
    <div class="quick-suggest" id="skillSuggest"></div>
    <div class="chip-list" id="skillChips"></div>

    <div class="section-label">जुड़ाव</div>
    <div class="pill-group" id="groupConnection"></div>
    <div class="inline-add-row" id="addRow-connection">
      <input type="text" id="addInput-connection" placeholder="नया विकल्प लिखें...">
      <button data-confirm="connection">जोड़ें</button>
    </div>

    <div class="section-label">खास बात</div>
    <div class="pill-group" id="groupSpecial"></div>
    <div class="inline-add-row" id="addRow-special">
      <input type="text" id="addInput-special" placeholder="नया विकल्प लिखें...">
      <button data-confirm="special">जोड़ें</button>
    </div>

    <div class="section-label">कोई और टैग (मनचाहा, सिर्फ इसी संपर्क के लिए)</div>

      <input type="text" id="customTagInput" placeholder="जैसे — शादी में मदद करता है">
      <button class="chip-add-btn" id="customTagAddBtn">जोड़ें</button>
    </div>
    <div class="chip-list" id="customTagChips"></div>

    <div class="field" style="margin-top:14px;">
      <label>नोट्स</label>
      <textarea id="fNotes" placeholder="कोई खास बात जो याद रखनी है..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">एंट्री हटाएँ</button>
      <div class="footer-right">
        <button class="btn btn-ghost" id="cancelBtn">रद्द करें</button>
        <button class="btn btn-primary" id="saveBtn">सेव करें</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const BASE_GROUPS = {
    relation: { label:'रिश्ता', tags:[
      {id:'blood', label:'खून का रिश्ता'},
      {id:'family-friend', label:'पारिवारिक मित्र'},
      {id:'village', label:'गाँव से जुड़ाव'},
      {id:'neighbour', label:'घर के पास / पड़ोसी'},
    ]},
    work: { label:'काम की समझ', tags:[
      {id:'problem-solver', label:'बड़ी समस्या सुलझाने वाला'},
      {id:'ordinary-work', label:'सामान्य काम'},
    ]},
    connection: { label:'जुड़ाव', tags:[
      {id:'business', label:'व्यापार से जुड़ा'},
      {id:'social-media', label:'सोशल मीडिया कनेक्शन'},
    ]},
    special: { label:'खास', tags:[
      {id:'family-event', label:'फैमिली फंक्शन के लिए बेस्ट'},
    ]},
  };
  const SKILL_SUGGESTIONS = ['प्लंबिंग','इलेक्ट्रिकल','बढ़ई का काम','पेंटर','मैकेनिक'];

  let contacts = [];
  let customGroupTags = { relation:[], work:[], connection:[], special:[] };
  let selectedFilters = new Set();
  let searchTerm = '';
  let editingId = null;
  let draft = null;
  let railOpen = false;

  const $ = (id)=>document.getElementById(id);
  const esc = (s)=> (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function allTagsForGroup(groupKey){
    return BASE_GROUPS[groupKey].tags.concat(customGroupTags[groupKey] || []);
  }

  const STORAGE_KEY_CONTACTS = 'rishta_contacts_v1';
  const STORAGE_KEY_TAGS = 'rishta_custom_tags_v1';

  async function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY_CONTACTS);
      contacts = raw ? JSON.parse(raw) : [];
    }catch(e){ contacts = []; }
    try{
      const raw2 = localStorage.getItem(STORAGE_KEY_TAGS);
      if(raw2) customGroupTags = JSON.parse(raw2);
    }catch(e){ /* keep defaults */ }

    // One-time recovery: earlier versions of this app saved data through
    // Claude's built-in artifact storage (window.storage) instead of the
    // browser's own localStorage. If this browser has nothing yet, but the
    // old storage does, pull it across automatically so nothing is lost.
    if(contacts.length === 0 && typeof window.storage !== 'undefined'){
      try{
        const old = await window.storage.get('contacts', false);
        if(old && old.value){
          const oldContacts = JSON.parse(old.value);
          if(Array.isArray(oldContacts) && oldContacts.length > 0){
            contacts = oldContacts;
            await saveContacts();
            const oldTags = await window.storage.get('customGroupTags', false);
            if(oldTags && oldTags.value){
              customGroupTags = JSON.parse(oldTags.value);
              await saveCustomGroupTags();
            }
            showToast('पुराना डेटा वापस मिल गया ✓');
          }
        }
      }catch(e){ /* old storage not available here — nothing to recover */ }
    }
  }
  async function saveContacts(){
    try{ localStorage.setItem(STORAGE_KEY_CONTACTS, JSON.stringify(contacts)); }
    catch(e){ console.error(e); showToast('डेटा सेव नहीं हो पाया — फ़ोन/ब्राउज़र की स्टोरेज भरी हो सकती है'); }
  }
  async function saveCustomGroupTags(){
    try{ localStorage.setItem(STORAGE_KEY_TAGS, JSON.stringify(customGroupTags)); }
    catch(e){ console.error(e); }
  }

  function contactHasFilter(c, key){
    if(key.startsWith('skill:')) return c.skills.includes(key.slice(6));
    if(key.startsWith('custom:')) return c.customTags.includes(key.slice(7));
    return c.tags.includes(key);
  }

  function getFiltered(){
    return contacts.filter(c=>{
      if(searchTerm){
        const t = searchTerm.toLowerCase();
        const inName = c.name.toLowerCase().includes(t);
        const inPhone = (c.phone||'').includes(searchTerm) || (c.altPhone||'').includes(searchTerm);
        if(!inName && !inPhone) return false;
      }
      for(const f of selectedFilters){ if(!contactHasFilter(c, f)) return false; }
      return true;
    });
  }
  function countFor(key){ return contacts.filter(c=>contactHasFilter(c,key)).length; }

  function collectDynamicTags(){
    const skills = new Set(), customs = new Set();
    contacts.forEach(c=>{
      (c.skills||[]).forEach(s=>skills.add(s));
      (c.customTags||[]).forEach(s=>customs.add(s));
    });
    return { skills:[...skills], customs:[...customs] };
  }

  function renderStats(){
    $('totalCount').textContent = contacts.length;
    $('eventCount').textContent = contacts.filter(c=>c.tags.includes('family-event')).length;
  }

  function renderTabRail(){
    const rail = $('tabRail');
    rail.innerHTML = '';
    Object.entries(BASE_GROUPS).forEach(([gid, group])=>{
      const wrap = document.createElement('div');
      const title = document.createElement('p');
      title.className = 'tab-group-title';
      title.textContent = group.label;
      wrap.appendChild(title);
      allTagsForGroup(gid).forEach(tag=>{
        wrap.appendChild(makeTabBtn(tag.label, tag.id, gid));
      });
      rail.appendChild(wrap);
    });
    const dyn = collectDynamicTags();
    if(dyn.skills.length || dyn.customs.length){
      const wrap = document.createElement('div');
      const title = document.createElement('p');
      title.className = 'tab-group-title';
      title.textContent = 'हुनर व अन्य टैग';
      wrap.appendChild(title);
      dyn.skills.forEach(s=> wrap.appendChild(makeTabBtn(s, 'skill:'+s, 'other')));
      dyn.customs.forEach(s=> wrap.appendChild(makeTabBtn(s, 'custom:'+s, 'other')));
      rail.appendChild(wrap);
    }
  }

  function makeTabBtn(label, key, groupClass){
    const btn = document.createElement('button');
    const active = selectedFilters.has(key);
    btn.className = 'tab-btn g-'+groupClass + (active ? ' active' : '');
    btn.innerHTML = `<span class="label-wrap"><span class="dot" style="background:var(--${groupClass==='other' ? 'text-faint' : groupClass})"></span><span>${esc(label)}</span></span><span class="cnt">${countFor(key)}</span>`;
    btn.addEventListener('click', ()=>{
      if(selectedFilters.has(key)) selectedFilters.delete(key); else selectedFilters.add(key);
      renderAll();
    });
    return btn;
  }

  function tagLookup(tagId){
    for(const [gid, group] of Object.entries(BASE_GROUPS)){
      const found = group.tags.find(t=>t.id===tagId);
      if(found) return { label: found.label, group: gid };
    }
    for(const [gid, list] of Object.entries(customGroupTags)){
      const found = (list||[]).find(t=>t.id===tagId);
      if(found) return { label: found.label, group: gid };
    }
    return null;
  }

  function renderFilterNote(){
    const note = $('filterNote');
    const text = $('filterNoteText');
    if(selectedFilters.size===0){ note.classList.remove('show'); return; }
    const labels = [...selectedFilters].map(k=>{
      if(k.startsWith('skill:')) return k.slice(6);
      if(k.startsWith('custom:')) return k.slice(7);
      const t = tagLookup(k);
      return t ? t.label : k;
    });
    text.textContent = `${selectedFilters.size} फ़िल्टर लागू: ${labels.join(' + ')}`;
    note.classList.add('show');
  }

  function avatarColorFor(c){
    const priority = ['relation','work','connection','special'];
    for(const gid of priority){
      const hit = c.tags.find(tid=>{ const t = tagLookup(tid); return t && t.group===gid; });
      if(hit){
        const map = { relation:'linear-gradient(135deg,#818CF8,#C7D2FE)', work:'linear-gradient(135deg,#2DD4BF,#99F6E4)', connection:'linear-gradient(135deg,#38BDF8,#BAE6FD)', special:'linear-gradient(135deg,#FBBF24,#FDE68A)' };
        return map[gid];
      }
    }
    return null;
  }

  function waLink(number){
    let digits = (number||'').replace(/\D/g,'');
    if(digits.length===10) digits = '91'+digits;
    return `https://wa.me/${digits}`;
  }

  function callHrefFor(number){
    let digits = (number||'').replace(/\D/g,'');
    if(digits.length===10) digits = '91'+digits;
    const isAndroid = /Android/i.test(navigator.userAgent);
    if(isAndroid){
      // Try to hand the dial intent to Truecaller specifically; if it isn't
      // installed, Android falls back to tel: (the phone's normal dialer).
      return `intent://${digits}#Intent;scheme=tel;package=com.truecaller;action=android.intent.action.DIAL;S.browser_fallback_url=tel:${digits};end`;
    }
    return `tel:${digits}`;
  }

  let toastTimer = null;
  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
  }

  function renderList(){
    const list = $('registerList');
    const filtered = getFiltered();
    list.innerHTML = '';
    if(contacts.length === 0){
      list.innerHTML = `<div class="empty-state"><p class="big">अभी लिस्ट खाली है</p><p>ऊपर "नई एंट्री" बटन से अपना पहला संपर्क जोड़ें।</p></div>`;
      return;
    }
    if(filtered.length === 0){
      list.innerHTML = `<div class="empty-state"><p class="big">कोई मेल खाता संपर्क नहीं मिला</p><p>खोज या फ़िल्टर बदलकर दोबारा कोशिश करें।</p></div>`;
      return;
    }
    filtered.forEach(c=>{
      const entry = document.createElement('div');
      entry.className = 'entry-card';
      const isEvent = c.tags.includes('family-event');
      const initial = (c.name||'?').trim().charAt(0).toUpperCase();
      const avatarBg = avatarColorFor(c);
      const tagChips = c.tags.map(tid=>{
        const t = tagLookup(tid);
        if(!t || tid==='family-event') return '';
        return `<span class="chip chip-${t.group}">${esc(t.label)}</span>`;
      }).join('');
      const skillChips = (c.skills||[]).map(s=>`<span class="chip chip-neutral">${esc(s)}</span>`).join('');
      const customChips = (c.customTags||[]).map(s=>`<span class="chip chip-neutral">${esc(s)}</span>`).join('');
      entry.innerHTML = `
        <div class="avatar" style="${avatarBg ? 'background:'+avatarBg : ''}">${esc(initial)}</div>
        <div class="entry-main">
          <div class="entry-top">
            <div>
              <div class="entry-name-wrap">
                <span class="entry-name">${esc(c.name)}</span>
                ${isEvent ? '<svg class="star-badge" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6z"/></svg>' : ''}
              </div>
              <div class="phone-row">
                <span class="phone-num">${esc(c.phone)}${c.altPhone ? ' · '+esc(c.altPhone) : ''}</span>
                <span class="phone-actions">
                  <a class="call" href="${callHrefFor(c.phone)}" target="_blank" rel="noopener" data-phone="${esc(c.phone)}" title="कॉल करें (Truecaller)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    कॉल
                  </a>
                  <a class="wa" href="${waLink(c.phone)}" target="_blank" rel="noopener" title="WhatsApp पर भेजें">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.36 7.56L3 20l1.06-5.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.5 10.5c.3 2 2.2 3.9 4.2 4.2"/></svg>
                    WhatsApp
                  </a>
                </span>
              </div>
            </div>
            <div class="entry-actions">
              <button class="icon-btn" data-edit="${c.id}" title="बदलें">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
            </div>
          </div>
          <div class="chip-row">${tagChips}${skillChips}${customChips}</div>
          ${c.notes ? `<div class="entry-notes">${esc(c.notes)}</div>` : ''}
        </div>
      `;
      list.appendChild(entry);
    });
    list.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModal(btn.getAttribute('data-edit')));
    });
    list.querySelectorAll('.call').forEach(a=>{
      a.addEventListener('click', ()=>{
        const num = a.getAttribute('data-phone') || '';
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(num).catch(()=>{});
        }
        showToast('नंबर कॉपी हो गया — अगर Truecaller/डायलर अपने आप न खुले तो पेस्ट करके कॉल करें');
      });
    });
  }

  function renderAll(){
    renderStats();
    renderTabRail();
    renderFilterNote();
    renderList();
    renderRailToggleState();
  }

  function renderRailToggleState(){
    $('tabRail').classList.toggle('hidden', !railOpen);
    const btn = $('filterToggleBtn');
    btn.classList.toggle('open', railOpen);
    btn.classList.toggle('active', selectedFilters.size > 0);
    const badge = $('filterBadge');
    if(selectedFilters.size > 0){
      badge.style.display = '';
      badge.textContent = selectedFilters.size;
    } else {
      badge.style.display = 'none';
    }
  }

  // ===== Modal =====
  function blankDraft(){
    return { id:null, name:'', phone:'', altPhone:'', tags:[], skills:[], customTags:[], notes:'' };
  }

  function renderPillGroup(containerId, groupKey){
    const el = $(containerId);
    el.innerHTML = '';
    allTagsForGroup(groupKey).forEach(tag=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      const on = draft.tags.includes(tag.id);
      btn.className = 'pill' + (on ? ' on-'+groupKey : '');
      btn.textContent = tag.label;
      btn.addEventListener('click', ()=>{
        if(draft.tags.includes(tag.id)) draft.tags = draft.tags.filter(t=>t!==tag.id);
        else draft.tags.push(tag.id);
        renderPillGroup(containerId, groupKey);
      });
      el.appendChild(btn);
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'pill pill-add';
    addBtn.textContent = '+ नया विकल्प';
    addBtn.addEventListener('click', ()=>{
      const row = $('addRow-'+groupKey);
      row.classList.toggle('show');
      if(row.classList.contains('show')) $('addInput-'+groupKey).focus();
    });
    el.appendChild(addBtn);
  }

  function confirmAddOption(groupKey){
    const input = $('addInput-'+groupKey);
    const label = input.value.trim();
    if(!label) return;
    const existing = allTagsForGroup(groupKey).find(t=>t.label.toLowerCase()===label.toLowerCase());
    let newTag;
    if(existing){
      newTag = existing;
    } else {
      newTag = { id: 'custom_'+groupKey+'_'+Date.now(), label };
      customGroupTags[groupKey] = customGroupTags[groupKey] || [];
      customGroupTags[groupKey].push(newTag);
      saveCustomGroupTags();
    }
    if(!draft.tags.includes(newTag.id)) draft.tags.push(newTag.id);
    input.value = '';
    $('addRow-'+groupKey).classList.remove('show');
    const containerMap = { relation:'groupRelation', work:'groupWork', connection:'groupConnection', special:'groupSpecial' };
    renderPillGroup(containerMap[groupKey], groupKey);
  }

  function renderChipList(containerId, arrName){
    const el = $(containerId);
    el.innerHTML = '';
    draft[arrName].forEach(val=>{
      const chip = document.createElement('span');
      chip.className = 'chip-removable';
      chip.innerHTML = `<span>${esc(val)}</span>`;
      const rm = document.createElement('button');
      rm.type = 'button'; rm.textContent = '×';
      rm.addEventListener('click', ()=>{
        draft[arrName] = draft[arrName].filter(v=>v!==val);
        renderChipList(containerId, arrName);
        if(arrName==='skills') renderSkillSuggest();
      });
      chip.appendChild(rm);
      el.appendChild(chip);
    });
  }

  function addChipValue(arrName, inputEl, containerId){
    const val = inputEl.value.trim();
    if(!val) return;
    if(!draft[arrName].includes(val)) draft[arrName].push(val);
    inputEl.value = '';
    renderChipList(containerId, arrName);
    if(arrName==='skills') renderSkillSuggest();
  }

  function renderSkillSuggest(){
    const el = $('skillSuggest');
    el.innerHTML = '';
    SKILL_SUGGESTIONS.filter(s=>!draft.skills.includes(s)).forEach(s=>{
      const btn = document.createElement('button');
      btn.type='button'; btn.textContent = '+ '+s;
      btn.addEventListener('click', ()=>{
        draft.skills.push(s);
        renderChipList('skillChips','skills');
        renderSkillSuggest();
      });
      el.appendChild(btn);
    });
  }

  function openModal(id){
    editingId = id || null;
    if(id){
      const c = contacts.find(x=>x.id===id);
      draft = JSON.parse(JSON.stringify(c));
      $('modalTitle').textContent = 'एंट्री बदलें';
      $('deleteBtn').style.display = '';
    } else {
      draft = blankDraft();
      $('modalTitle').textContent = 'नई एंट्री जोड़ें';
      $('deleteBtn').style.display = 'none';
    }
    $('fName').value = draft.name;
    $('fPhone').value = draft.phone;
    $('fAltPhone').value = draft.altPhone;
    $('fNotes').value = draft.notes;
    renderPillGroup('groupRelation','relation');
    renderPillGroup('groupWork','work');
    renderPillGroup('groupConnection','connection');
    renderPillGroup('groupSpecial','special');
    ['relation','work','connection','special'].forEach(g=>{
      $('addRow-'+g).classList.remove('show');
      $('addInput-'+g).value = '';
    });
    renderChipList('skillChips','skills');
    renderChipList('customTagChips','customTags');
    renderSkillSuggest();
    $('modalOverlay').classList.add('open');
    $('fName').focus();
  }

  function closeModal(){
    $('modalOverlay').classList.remove('open');
    editingId = null; draft = null;
  }

  async function handleSave(){
    const name = $('fName').value.trim();
    const phone = $('fPhone').value.trim();
    if(!name){ $('fName').focus(); return; }
    if(!phone){ $('fPhone').focus(); return; }
    draft.name = name; draft.phone = phone;
    draft.altPhone = $('fAltPhone').value.trim();
    draft.notes = $('fNotes').value.trim();
    if(editingId){
      const idx = contacts.findIndex(c=>c.id===editingId);
      contacts[idx] = draft;
    } else {
      draft.id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      contacts.push(draft);
    }
    await saveContacts();
    closeModal();
    renderAll();
  }

  async function handleDelete(){
    if(!editingId) return;
    contacts = contacts.filter(c=>c.id!==editingId);
    await saveContacts();
    closeModal();
    renderAll();
  }

  // ===== Wiring =====
  function exportBackup(){
    const data = { contacts, customGroupTags, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rishta-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('बैकअप डाउनलोड हो गया');
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!Array.isArray(data.contacts)){ showToast('यह फ़ाइल सही फॉर्मेट में नहीं है'); return; }
        contacts = data.contacts;
        if(data.customGroupTags) customGroupTags = data.customGroupTags;
        await saveContacts();
        await saveCustomGroupTags();
        renderAll();
        showToast('बैकअप वापस आ गया ✓');
      }catch(err){
        showToast('फ़ाइल पढ़ने में दिक्कत हुई');
      }
    };
    reader.readAsText(file);
  }

  $('exportBtn').addEventListener('click', exportBackup);
  $('importBtn').addEventListener('click', ()=> $('importFile').click());
  $('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });

  $('filterToggleBtn').addEventListener('click', ()=>{ railOpen = !railOpen; renderRailToggleState(); });
  $('addBtn').addEventListener('click', ()=>openModal(null));
  $('cancelBtn').addEventListener('click', closeModal);
  $('saveBtn').addEventListener('click', handleSave);
  $('deleteBtn').addEventListener('click', handleDelete);
  $('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

  $('skillAddBtn').addEventListener('click', ()=>addChipValue('skills', $('skillInput'), 'skillChips'));
  $('skillInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addChipValue('skills', $('skillInput'), 'skillChips'); }});
  $('customTagAddBtn').addEventListener('click', ()=>addChipValue('customTags', $('customTagInput'), 'customTagChips'));
  $('customTagInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addChipValue('customTags', $('customTagInput'), 'customTagChips'); }});

  ['relation','work','connection','special'].forEach(g=>{
    $('addInput-'+g).addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmAddOption(g); }});
  });
  document.querySelectorAll('[data-confirm]').forEach(btn=>{
    btn.addEventListener('click', ()=> confirmAddOption(btn.getAttribute('data-confirm')));
  });

  $('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; renderList(); });
  $('clearFiltersBtn').addEventListener('click', ()=>{ selectedFilters.clear(); renderAll(); });

  (async function init(){
    await loadData();
    renderAll();
  })();
})();
</script>
</body>
</html>
